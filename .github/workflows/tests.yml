name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas>=2.0" "pyarrow>=14" numpy pytest
      # Data-dependent tests (source assumptions, built outputs) skip automatically
      # without raw/ and build/; run them locally after a build: pytest tests
      - run: pytest tests -q
